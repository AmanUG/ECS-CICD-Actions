name: Deploy to ECS (EC2)

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build and tag Docker image
        run: |
          docker build -t ecs-demo-app:latest .
          docker tag ecs-demo-app:latest 436438563472.dkr.ecr.eu-west-2.amazonaws.com/ecs-demo-app:latest

      - name: Push image to ECR
        run: |
          docker push 436438563472.dkr.ecr.eu-west-2.amazonaws.com/ecs-demo-app:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          aws-region: eu-west-2
          cluster: DevCluster
          service: ecs-demo-service
          task-definition: ecs-demo-task-definition
